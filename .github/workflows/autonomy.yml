name: autonomy

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: auto-research-2-autonomy
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTONOMY_ENABLED: "1"
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_TOKEN: ${{ github.token }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      SOCCERNET_PASSWORD: ${{ secrets.SOCCERNET_PASSWORD }}
      WEEKLY_BUDGET_USD: "25"
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install controller dependencies
        run: python -m pip install --upgrade huggingface_hub

      - name: Run one autonomy tick
        run: python scripts/autonomy_tick.py

      - name: Commit autonomy state
        run: |
          git config user.name "auto-research-2 bot"
          git config user.email "actions@users.noreply.github.com"
          git add autonomy/state.json autonomy/events.jsonl
          if ! git diff --cached --quiet; then
            git commit -m "Record autonomy tick"
            git pull --rebase
            git push
          fi
