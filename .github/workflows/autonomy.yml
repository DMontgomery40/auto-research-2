name: autonomy

on:
  workflow_dispatch:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  issue_comment:
    types: [created, edited]
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: auto-research-2-autonomy
  cancel-in-progress: false

jobs:
  tick:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'schedule' ||
        contains(join(github.event.issue.labels.*.name, ','), 'autonomy')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTONOMY_ENABLED: "1"
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_TOKEN: ${{ github.token }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      SOCCERNET_USERNAME: ${{ secrets.SOCCERNET_USERNAME }}
      SOCCERNET_PASSWORD: ${{ secrets.SOCCERNET_PASSWORD }}
      SOCCERNET_SIGNIN_PASSWORD: ${{ secrets.SOCCERNET_SIGNIN_PASSWORD }}
      SOCCERNET_PASSWORD_2: ${{ secrets.SOCCERNET_PASSWORD_2 }}
      WEEKLY_BUDGET_USD: "25"
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Refresh state before tick
        run: git pull --ff-only

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install controller dependencies
        run: python -m pip install --upgrade huggingface_hub

      - name: Run one autonomy tick
        run: python scripts/autonomy_tick.py

      - name: Commit autonomy state
        run: |
          git config user.name "auto-research-2 bot"
          git config user.email "actions@users.noreply.github.com"
          git add autonomy/state.json autonomy/events.jsonl CURRENT.md LEDGER.md BUDGET.md JOURNAL.md
          if ! git diff --cached --quiet; then
            git commit -m "Record autonomy tick"
            if ! git pull --rebase; then
              git rebase --abort || true
              echo "Remote autonomy state changed; dropping stale tick state."
              exit 0
            fi
            git push
          fi
